---
- name: "APT: install SSSD and dependencies"
  ansible.builtin.apt:
    pkg:
      - sssd
      - sssd-ipa
      - sssd-idp
      - sssd-tools
      - sssd-kcm
      - sssd-passkey
      - krb5-user
      - krb5-pkinit
      - kstart
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: "DNF: install FreeIPA Client"
  ansible.builtin.dnf:
    name:
      - sssd
      - sssd-ipa
      - sssd-idp
      - sssd-tools
      - sssd-kcm
      - sssd-passkey
      - krb5-workstation
      - krb5-pkinit
      - oddjob-mkhomedir
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Fix up paths in sssd idp support"
  ansible.builtin.replace:
    path: /etc/krb5.conf.d/sssd_enable_idp
    regexp: "/lib64/"
    replace: "/lib/x86_64-linux-gnu/"
  when: ansible_facts['os_family'] == 'Debian'

- name: See if ca certificate is already installed
  ansible.builtin.stat:
    path: /etc/pki/sssd_cacert.pem
  register: sssd_cacert

- name: Download ca certificate to control node
  ansible.builtin.get_url:
    url: "{{ auth_sssd_cacert_url }}"
    dest: "/etc/pki/sssd_cacert.pem"
    validate_certs: false
    mode: "0644"
  when: not sssd_cacert.stat.exists

- name: krb5.conf
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    mode: "0644"

- name: ldap.conf
  ansible.builtin.template:
    src: ldap.conf.j2
    dest: /etc/ldap/ldap.conf
    owner: root
    mode: "0644"

- name: sssd.conf
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    mode: "0600"
  register: sssd_conf
  notify: sssd_restart

- name: Enable sssd
  ansible.builtin.service:
    name: sssd
    enabled: true
    state: started

- name: Enable oddjob
  ansible.builtin.service:
    name: oddjob
    enabled: true
    state: started
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Debian: Install IPA pam-auth-update module"
  ansible.builtin.copy:
    src: pam-auth-update-ipa
    dest: /usr/share/pam-configs/ipa
    owner: root
    mode: "0644"
  register: pam_auth_update_ipa
  when: ansible_facts['os_family'] == 'Debian'

- name: "Debian: Install access control pam-auth-update module"
  ansible.builtin.copy:
    src: pam-auth-update-access
    dest: /usr/share/pam-configs/access
    owner: root
    mode: "0644"
  register: pam_auth_update_access
  when: ansible_facts['os_family'] == 'Debian'

- name: "Debian: Disable sss module and enable ipa and access modules"
  ansible.builtin.command: "pam-auth-update --disable sss sss-smart-card-optional sss-smart-card-required --enable ipa access mkhomedir --force"
  when: ansible_facts['os_family'] == 'Debian' and (pam_auth_update_ipa.changed or pam_auth_update_access.changed)

- name: "Redhat: Configure PAM"
  ansible.builtin.command: "authselect select sssd with-mkhomedir"
  when: ansible_facts['os_family'] == 'RedHat' and sssd_conf.changed

- name: "Redhat: Enable pam access module"
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/system-auth"
    line: "account required                  pam_access.so"
    insertbefore: "^account.*"
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Redhat: sudo allow gssapi auth"
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ item }}"
    line: "auth sufficient pam_sss_gss.so"
    insertbefore: "^auth.*system-auth.*"
  with_items:
    - "sudo"
    - "sudo-i"
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Install /etc/krb5.keytab"
  ansible.builtin.copy:
    dest: /etc/krb5.keytab
    content: "{{ auth_sssd_host_keytab | b64decode }}"
    owner: root
    mode: "0600"
  when: auth_sssd_host_keytab is defined

- name: "configure ssh to allow sssd authorized keys and kbd interactive auth"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }} .*"
    line: "{{ item.key }} {{ item.val }}"
  with_items:
    - { key: "AuthorizedKeysCommand", val: "/usr/bin/sss_ssh_authorizedkeys" }
    - { key: "AuthorizedKeysCommandUser", val: "nobody" }
    - { key: "KbdInteractiveAuthentication", val: "yes" }
  notify: sshd_restart

- name: "Limit system access"
  ansible.builtin.template:
    src: access.conf.j2
    dest: /etc/security/access.conf
    mode: "644"
  when: auth_sssd_access is defined

- name: "setup sudoers"
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/sss-sudoers
    mode: "600"
  when: auth_sssd_sudoers is defined

- name: "make sure cloudinit sudoers no longer exists"
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
  when: auth_sssd_sudoers is defined

- name: Flush Handlers
  ansible.builtin.meta: flush_handlers
