---
- name: "APT: install SSSD and dependencies"
  ansible.builtin.apt:
    pkg:
      - sssd
      - sssd-ipa
      - sssd-idp
      - sssd-tools
      - sssd-kcm
      - sssd-passkey
      - krb5-user
      - krb5-pkinit
      - kstart
    state: present
  when: ansible_os_family == 'Debian'

- name: "DNF: install FreeIPA Client"
  ansible.builtin.dnf:
    name:
      - sssd
      - sssd-ipa
      - sssd-idp
      - sssd-tools
      - sssd-kcm
      - sssd-passkey
      - krb5-workstation
      - krb5-pkinit
      - oddjob-mkhomedir
    state: present
  when: ansible_os_family == 'RedHat'

- name: "Fix up paths in sssd idp support"
  ansible.builtin.replace:
    path: /etc/krb5.conf.d/sssd_enable_idp
    regexp: "/lib64/"
    replace: "/lib/x86_64-linux-gnu/"
  when: ansible_os_family == 'Debian'

- name: See if ca certificate is already installed
  ansible.builtin.stat:
    path: /etc/pki/sssd_cacert.pem
  register: sssd_cacert

- name: Download ca certificate to control node
  ansible.builtin.get_url:
    url: "{{ auth_sssd_cacert_url }}"
    dest: "/tmp/sssd_cacert.pem"
    validate_certs: false
  delegate_to: localhost
  changed_when: false
  become: false
  run_once: true
  when: not sssd_cacert.stat.exists

- name: "Set Domain"
  ansible.builtin.set_fact:
    domain: "{{ (inventory_hostname | split('.'))[1:] | join('.') }}"

- name: Install cacert
  ansible.builtin.copy:
    src: /tmp/sssd_cacert.pem
    dest: /etc/pki/sssd_cacert.pem
    mode: "0644"
    owner: root
  when: not sssd_cacert.stat.exists

- name: krb5.conf
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    mode: "0644"

- name: ldap.conf
  ansible.builtin.template:
    src: ldap.conf.j2
    dest: /etc/ldap/ldap.conf
    owner: root
    mode: "0644"

- name: sssd.conf
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    mode: "0600"
  register: sssd_conf
  notify: sssd_restart

- name: Enable sssd
  ansible.builtin.service:
    name: sssd
    enabled: true
    state: started

- name: Enable oddjob
  ansible.builtin.service:
    name: oddjob
    enabled: true
    state: started
  when: ansible_os_family == 'RedHat'

- name: "Debian: Install IPA pam-auth-update module"
  copy:
    src: pam-auth-update-ipa
    dest: /usr/share/pam-configs/ipa
    owner: root
    mode: 0644
  when: ansible_os_family == 'Debian'

- name: "Debian: Configure PAM"
  ansible.builtin.command: "pam-auth-update --disable sss sss-smart-card-optional sss-smart-card-required --enable ipa mkhomedir"
  when: ansible_os_family == 'Debian' and sssd_conf.changed

- name: "Redhat: Configure PAM"
  ansible.builtin.command: "authselect select sssd with-mkhomedir"
  when: ansible_os_family == 'RedHat' and sssd_conf.changed

- name: "Make sure sssd enumerate is enabled and sudo can use kerberos"
  community.general.ini_file:
    path: /etc/sssd/sssd.conf
    section: "domain/{{ domain }}"
    option: "{{ item.key }}"
    value: "{{ item.value }}"
  with_items:
    - { "key": "enumerate", "value": "True" }
    - { "key": "pam_gssapi_services", "value": "sudo, sudo-i" }
  notify: restart_sssd

- name: "Redhat: sudo allow gssapi auth"
  lineinfile:
    path: "/etc/pam.d/{{ item }}"
    line: "auth sufficient pam_sss_gss.so"
    insertbefore: "^auth.*system-auth.*"
  with_items:
    - "sudo"
    - "sudo-i"
  when: ansible_os_family == 'RedHat'

- name: "Install /etc/krb5.keytab"
  ansible.builtin.copy:
    dest: /etc/krb5.keytab
    content: "{{ auth_sssd_host_keytab | b64decode }}"
    owner: root
    mode: "0600"
  when: auth_sssd_host_keytab is defined

- name: Flush Handlers
  ansible.builtin.meta: flush_handlers
